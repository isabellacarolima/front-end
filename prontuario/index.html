<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body>
    <!--Navbar-->
    <nav class="navbar navbar-dark bg-primary">
        <div class="container-fluid justify-content-center">
            <span class="navbar-brand mb-0 h1">Próntuario Eletronico</span>
        </div>
    </nav>

    <div class="container mt-4">
        <form onsubmit="mostrarDados(); return false;">
            <!--Dados do paciente-->
            <div class="card mb-4">
                <div class="card-header bg-info text-white text-center"> Dados do Paciente
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="formGroupExampleInput" class="form-label">Nome</label>
                            <input type="text" class="form-control" id="nome" required>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="formGroupExampleInput" class="form-label">Idade</label>
                            <input type="number" class="form-control" id="idade" required>
                        </div>
                        <div class="col-md-3 mb-3"> Sexo

                            <select class="form-select" aria-label="Default select exemple" required id="sexo"> 
                                <option value="masculino">Masculino</option>
                                <option value="feminino">Feminino</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
 
            <!--Sinais vitais-->
            <div class="card mb-4">
                <div class="card-header bg-info text-white text-center"> Sinais Vitais
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-3 mb-3">
                            <label for="formGroupExampleInput" class="form-label">Pressão Arterial</label>
                            <input type="text" class="form-control" id="pressao" placeholder="120/80" required>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="formGroupExampleInput" class="form-label">Temperatura</label>
                            <input type="number" class="form-control" min="34" max="42" step="0.1" placeholder="°C" id="temperatura" required>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="formGroupExampleInput" class="form-label">Frequência Cardíaca</label>
                            <input type="number" class="form-control" id="frequencia" placeholder="bpm" required>
                        </div>
                        <div class="col-md-3 mb-3">
                             <label for="formGroupExampleInput" class="form-label">Saturção</label>
                            <input type="number" class="form-control" step="0.1" placeholder="%" id="saturacao" required>
                        </div>
                    </div>
                </div>
            </div>

            <!--evolução-->
            <div class="card mb-4">
                <div class="card-header bg-info text-white text-center"> Evolução do Paciente
                </div>
                <div class="card-body">
                    <div class="mb-3"> Descreva a evolução: <br>
                        <textarea class="form-control" rows="4" id="evolucao" required></textarea>
                    </div>
                </div>
            </div>

            <!--medicação-->
            <div class="card mb-4">
                <div class="card-header bg-info text-white text-center"> Medicação
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6 mb-3">Medicamento
                        <label for="formGroupExampleInput" class="form-label"></label>
                        <input type="text" class="form-control" id="medicamento" required>
                        </div>
                        <div class="col-md-3 mb-3">Dosagem
                            <label for="formGroupExampleInput" class="form-label"></label>
                            <input type="text" class="form-control" id="dosagem" required>
                        </div>
                        <div class="col-md-3 mb-3">Horário
                            <label for="hora"></label>
                            <input type="time" class="form-control" id="hora" required>
                        </div>
                    </div>
                </div>
            </div>

            <!--botão-->
            <div class="text-end mb-5">
                <button class="btn btn-primary" type="submit"> Salvar Prontuário
                </button>
            </div>
        </form>
        <p id="mensagem" style="color: aqua; display: none; margin-top: 10px;">Prontuário enviado!</p>
    </div>

    <!--Caixa resultados-->
    <div id="resultado" class="alert alert-secondary d-none text-center"></div>
    
    <div class="toast position-fixed bottom-0 end-0 p-3" id="toastSucesso">
        <div class="toast-header">
            <strong class="me-auto">Sistema</strong>
            <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
        </div>
        <div class="toast-body"> Prontuário salvo com sucesso!
        </div>
    </div>
   
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        
        <script>
        function mostrarDados() {
        let toast = new bootstrap.Toast(document.getElementById('toastSucesso')); 
        toast.show();

        let nome = document.getElementById("nome").value;
        let idade = document.getElementById("idade").value;
        let sexo = document.getElementById("sexo").value;
        let pressao = document.getElementById("pressao").value;
        let temperatura = document.getElementById("temperatura").value;
        let frequencia = document.getElementById("frequencia").value;
        let saturacao = document.getElementById("saturacao").value;
        let evolucao = document.getElementById("evolucao").value;
        let medicamento = document.getElementById("medicamento").value;
        let dosagem = document.getElementById("dosagem").value;
        let hora = document.getElementById("hora").value;
            
        let resultado = `

        <h5>Prontuário do Paciente</h5>
        Nome: ${nome} <br>
        Idade: ${idade} <br>
        Sexo: ${sexo} <br>
        Pressão Arterial: ${pressao} <br>
        Temperatura: ${temperatura} <br>
        Frequência Cardíaca: ${frequencia} <br>
        Saturação: ${saturacao} <br>
        Evolução: ${evolucao} <br>
        Medicamento: ${medicamento} <br>
        Dosagem: ${dosagem} <br>
        Horário: ${hora} <br>
        `;

        let caixa = document.getElementById("resultado");
        caixa.innerHTML = resultado;
        caixa.classList.remove("d-none");
    }

    </script>
</body>
</html>
