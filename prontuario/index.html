<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body>
    <!--Navbar-->
    <nav class="navbar navbar-dark bg-primary">
        <div class="container-fluid justify-content-center">
            <span class="navbar-brand mb-0 h1">Próntuario Eletronico</span>
        </div>
    </nav>

    <div class="container mt-4">
        <form>
            <!--Dados do paciente-->
            <div class="card mb-4">
                <div class="card-header bg-info text-white text-center"> Dados do Paciente
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="formGroupExampleInput" class="form-label">Nome</label>
                            <input type="text" class="form-control" id="formGroupExampleInput">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="formGroupExampleInput" class="form-label">Idade</label>
                            <input type="number" class="form-control" id="formGroupExampleInput">
                        </div>
                        <div class="col-md-3 mb-3"> Sexo

                            <select class="form-select" aria-label="Default select exemple"> 
                                <option value="1">Masculino</option>
                                <option value="2">Feminino</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
 
            <!--Sinais vitais-->
            <div class="card mb-4">
                <div class="card-header bg-info text-white text-center"> Sinais Vitais
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-3 mb-3">
                            <label for="formGroupExampleInput" class="form-label">Pressão Arterial</label>
                            <input type="text" class="form-control" id="formGroupExampleInput" placeholder="120/80">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="formGroupExampleInput" class="form-label">Temperatura</label>
                            <input type="number" class="form-control" min="34" max="42" step="0.1" placeholder="°C" id="formGroupExampleInput">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="formGroupExampleInput" class="form-label">Frequencia Cardíaca</label>
                            <input type="number" class="form-control" id="formGroupExampleInput" placeholder="bpm">
                        </div>
                        <div class="col-md-3 mb-3">
                             <label for="formGroupExampleInput" class="form-label">Saturção</label>
                            <input type="number" class="form-control" step="0.1" placeholder="%" id="formGroupExampleInput">
                        </div>
                    </div>
                </div>
            </div>

            <!--evolução-->
            <div class="card mb-4">
                <div class="card-header bg-info text-white text-center"> Evolução do Paciente
                </div>
                <div class="card-body">
                    <div class="mb-3"> Descreva a evolução: <br>
                        <textarea class="form-control" rows="4"></textarea>
                    </div>
                </div>
            </div>

            <!--medicação-->
            <div class="card mb-4">
                <div class="card-header bg-info text-white text-center"> Medicação
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6 mb-3">Medicamento
                        <label for="formGroupExampleInput" class="form-label"></label>
                        <input type="text" class="form-control" id="formGroupExampleInput">
                        </div>
                        <div class="col-md-3 mb-3">Dosagem
                            <label for="formGroupExampleInput" class="form-label"></label>
                            <input type="text" class="form-control" id="formGroupExampleInput">
                        </div>
                        <div class="col-md-3 mb-3">Horário
                            <label for="hora"></label>
                            <input type="time" class="form-control" id="hora">
                        </div>
                    </div>
                </div>
            </div>

            <!--botão-->
            <div class="text-end mb-5">
                <button class="btn btn-primary" type="submit"> Salvar Prontuário
                </button>
            </div>
        </form>
        <p id="mensagem" style="color: aqua; display: none; margin-top: 10px;">Prontuário enviado!</p>
    </div>
   
</body>
</html>
