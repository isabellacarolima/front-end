<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fit Day</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" >
    <style>
        form {
            margin-top: 180px;
        }
        h1{
            margin-top: 50px;
        }
    </style>

</head>
<body class="p-3 bg-black text-white ">
    
    
    <!-- inserir dados-->
     
    <form id="formLogin">
        <h1 class="text-center">Fit Day</h1>
    <div class="d-grid gap-2 col-6 mx-auto ">
     <label for="exempleInputName1" class="form-label ">Name</label>
     <input type="text" class="form-control bg-dark text-white" id="nome" aria-describedby="nameHelp">
     </div> <br>
    <div class="d-grid gap-2 col-6 mx-auto">
     <label for="exempleInputEmail1" class="form-label">Email</label>
     <input type="email" class="form-control bg-dark text-white" id="email" aria-describedby="emailHelp">
     </div> <br>
     <div class="d-grid gap-2 col-6 mx-auto">
     <label for="exempleInputPassword1" class="form-label">Password</label>
     <input type="password" class="form-control bg-dark text-white" id="senha">
     </div> <br>
     <p id="mensagem" class="text-center text-white"></p>
     <div class="d-grid gap-2 col-6 mx-auto ">
     <button type="submit" class="btn btn-outline-secondary">Sign up</button>
    </div>
     </form>
     

    <script src="java.js"></script>
</body>
</html>
